<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON DASH — NEXUS ARCADE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b16;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh;background:#101b2c}
#hud{position:fixed;inset:0;pointer-events:none;padding:18px;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 8px #000}
.stat{background:#07101dcc;border:1px solid #ffffff25;border-radius:14px;padding:9px 14px;min-width:92px;backdrop-filter:blur(8px)}
.stat small{display:block;color:#aabbd2;font-size:10px;letter-spacing:1.5px;font-weight:800}.stat b{font-size:22px}
#right{display:flex;gap:8px}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#07101a99,#070a13dd);padding:22px}
.panel{width:min(440px,100%);text-align:center;background:#10192beF;border:1px solid #ffffff25;border-radius:26px;padding:30px 25px;box-shadow:0 25px 90px #0009}
.logo{font-size:12px;letter-spacing:4px;color:#66e4ff;font-weight:900}
h1{font-size:clamp(38px,10vw,62px);line-height:.95;margin:12px 0;background:linear-gradient(100deg,#7ef0ff,#a78bfa,#ffcb73);color:transparent;background-clip:text;letter-spacing:-2px}
p{color:#b5c4d9;line-height:1.55;font-size:14px}
button{border:0;border-radius:13px;padding:14px 22px;background:linear-gradient(100deg,#7758f4,#24bfe4);color:white;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 8px 25px #4c8cff55}
.hint{font-size:12px;color:#8194ad;margin-top:17px}
#mobile{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}
.pad{display:flex;gap:9px}.pad button{pointer-events:auto;width:52px;height:48px;padding:0;background:#091426bb;border:1px solid #ffffff30;box-shadow:none;font-size:20px}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
 <div class="stat"><small>DISTANCE</small><b id="score">0</b></div>
 <div id="right"><div class="stat"><small>COINS</small><b id="coins">0</b></div><div class="stat"><small>BEST</small><b id="best">0</b></div></div>
</div>
<div id="mobile" class="hidden">
 <div class="pad"><button id="left">◀</button><button id="rightBtn">▶</button></div>
 <div class="pad"><button id="jump">▲</button><button id="slide">▼</button></div>
</div>
<div id="overlay">
 <div class="panel">
  <div class="logo">NEXUS ARCADE ORIGINAL</div>
  <h1>NEON<br>DASH</h1>
  <p>Dodge barriers, leap over roadblocks and slide under gates as you race through a glowing city. Grab coins and see how far you can go.</p>
  <button id="start">START RUN</button>
  <div class="hint">← → CHANGE LANES &nbsp; • &nbsp; ↑ JUMP &nbsp; • &nbsp; ↓ SLIDE<br>On mobile: swipe or use the buttons</div>
 </div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,dpr, running=false, over=false, last=0, time=0, speed=390, distance=0, coinCount=0, lane=1, playerY=0, vy=0, sliding=0, invuln=0;
let objects=[], spawn=0, best=Number(localStorage.getItem('neonDashBest')||0);
const $=id=>document.getElementById(id);
$('best').textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function reset(){objects=[];time=0;speed=390;distance=0;coinCount=0;lane=1;playerY=0;vy=0;sliding=0;invuln=0;spawn=.7;last=performance.now();running=true;over=false;$('overlay').classList.add('hidden');$('hud').classList.remove('hidden');$('mobile').classList.remove('hidden');requestAnimationFrame(loop)}
function road(){const horizon=H*.22, bottom=H*1.08, cx=W/2, rw=Math.min(W*.94,650);ctx.fillStyle='#101b2b';ctx.fillRect(0,0,W,H);
let sky=ctx.createLinearGradient(0,0,0,horizon+30);sky.addColorStop(0,'#091326');sky.addColorStop(1,'#273a57');ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon+35);
for(let i=0;i<13;i++){let x=(i*97+time*9)%(W+100)-50;let bh=30+(i*37)%90;ctx.fillStyle=i%2?'#182a42':'#1b2d48';ctx.fillRect(x,horizon-bh,35,bh);for(let y=horizon-bh+8;y<horizon-5;y+=13){ctx.fillStyle='#55c9e9';ctx.globalAlpha=.2;ctx.fillRect(x+7,y,4,5);ctx.fillRect(x+21,y,4,5);ctx.globalAlpha=1}}
ctx.fillStyle='#1a2533';ctx.beginPath();ctx.moveTo(cx-rw*.18,horizon);ctx.lineTo(cx+rw*.18,horizon);ctx.lineTo(cx+rw*.5,bottom);ctx.lineTo(cx-rw*.5,bottom);ctx.closePath();ctx.fill();
ctx.strokeStyle='#53677e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx-rw*.18,horizon);ctx.lineTo(cx-rw*.5,bottom);ctx.moveTo(cx+rw*.18,horizon);ctx.lineTo(cx+rw*.5,bottom);ctx.stroke();
for(let j=1;j<=2;j++){let x=cx-rw*.18+(rw*.36/3)*j;ctx.strokeStyle='#52657a';ctx.lineWidth=2;ctx.setLineDash([18,17]);ctx.lineDashOffset=-time*speed*.07;ctx.beginPath();ctx.moveTo(x,horizon);ctx.lineTo(cx+(x-cx)*2.78,bottom);ctx.stroke()}ctx.setLineDash([]);
for(let i=0;i<7;i++){let z=(i/7+(time*speed/850)%1)%1;let y=horizon+(bottom-horizon)*z*z;let width=rw*(.18+.32*z);ctx.fillStyle='#263a4d';ctx.fillRect(cx-width/2,y,width,3+z*5)}
}
function laneX(l,z=1){let cx=W/2, spread=Math.min(W*.28,185);return cx+(l-1)*spread*z}
function spawnObj(){let l=Math.floor(Math.random()*3), r=Math.random();let type=r<.48?'coin':r<.7?'block':r<.85?'barrier':'gate';if(type==='coin'){for(let k=0;k<5;k++)objects.push({type,lane:l,z:0.02+k*.065,got:false})}else objects.push({type,lane:l,z:0,hit:false});}
function drawObject(o){let z=o.z, y=H*.22+(H*.82-H*.22)*z*z, x=laneX(o.lane,.36+.64*z), s=.25+1.1*z;
if(o.type==='coin'){ctx.save();ctx.translate(x,y-24*s);ctx.scale(s,s);ctx.fillStyle='#ffd45e';ctx.strokeStyle='#fff1a8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#a86b18';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('$',0,5);ctx.restore();return}
let w=55*s,h= o.type==='block'?55*s:o.type==='barrier'?22*s:20*s;
if(o.type==='block'){ctx.fillStyle='#f06b5c';ctx.fillRect(x-w/2,y-h,w,h);ctx.fillStyle='#ffb18a';ctx.fillRect(x-w/2,y-h,w,7*s);ctx.fillStyle='#8b303b';ctx.fillRect(x-w/2,y-h*.35,w,h*.15)}
if(o.type==='barrier'){ctx.fillStyle='#e9b64e';ctx.fillRect(x-w/2,y-h,w,h);ctx.strokeStyle='#fff0b2';ctx.lineWidth=5*s;ctx.beginPath();ctx.moveTo(x-w*.35,y-h);ctx.lineTo(x-w*.1,y);ctx.moveTo(x+w*.1,y-h);ctx.lineTo(x+w*.35,y);ctx.stroke()}
if(o.type==='gate'){ctx.fillStyle='#a56cf2';ctx.fillRect(x-w/2,y-70*s,w*.18,70*s);ctx.fillRect(x+w/2-w*.18,y-70*s,w*.18,70*s);ctx.fillRect(x-w/2,y-70*s,w,14*s);ctx.fillStyle='#d9baff';ctx.fillRect(x-w/2,y-70*s,w,4*s)}
}
function drawPlayer(){let x=laneX(lane), ground=H*.82-playerY, squash=sliding>0?.58:1;ctx.save();ctx.translate(x,ground);ctx.scale(1,squash);
ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,8,22,7,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#39d6e8';ctx.beginPath();ctx.roundRect(-15,-58,30,43,9);ctx.fill();ctx.fillStyle='#f5c59e';ctx.beginPath();ctx.arc(0,-70,14,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#27334c';ctx.fillRect(-14,-82,28,8);ctx.fillStyle='#ffcf6a';ctx.fillRect(-8,-73,5,3);ctx.fillRect(4,-73,5,3);
ctx.strokeStyle='#f5c59e';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-12,-48);ctx.lineTo(-19,-26);ctx.moveTo(12,-48);ctx.lineTo(19,-26);ctx.stroke();
ctx.strokeStyle='#344b76';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-7,-18);ctx.lineTo(-10,-3);ctx.moveTo(7,-18);ctx.lineTo(10,-3);ctx.stroke();ctx.restore()}
function move(dir){if(!running)return;lane=Math.max(0,Math.min(2,lane+dir))}
function jump(){if(running&&playerY<1){vy=690}}
function slide(){if(running)sliding=.65}
function end(){running=false;over=true;best=Math.max(best,Math.floor(distance));localStorage.setItem('neonDashBest',best);$('best').textContent=best;$('overlay').classList.remove('hidden');$('overlay').innerHTML=`<div class="panel"><div class="logo">RUN COMPLETE</div><h1>GAME<br>OVER</h1><p>Distance: <b>${Math.floor(distance)}</b><br>Coins collected: <b>${coinCount}</b><br>Best distance: <b>${best}</b></p><button id="again">RUN AGAIN</button><div class="hint">Keep moving. Your next record is waiting.</div></div>`;$('again').onclick=reset;$('mobile').classList.add('hidden')}
function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.035);last=now;time+=dt;distance+=speed*dt*.035;speed=Math.min(760,390+time*7);if(invuln>0)invuln-=dt;if(sliding>0)sliding-=dt;
if(playerY>0||vy>0){playerY+=vy*dt;vy-=1700*dt;if(playerY<0){playerY=0;vy=0}}
spawn-=dt;if(spawn<=0){spawnObj();spawn=Math.max(.48,1.05-(speed-390)/700)+Math.random()*.28}
for(let o of objects){o.z+=dt*speed/780;if(o.z>.84&&o.z<.99&&o.lane===lane&&!o.hit){if(o.type==='coin'){if(!o.got){o.got=true;coinCount++;$('coins').textContent=coinCount}}else{let safe=o.type==='block'?playerY>45:o.type==='barrier'?playerY>25:sliding>0;if(!safe){o.hit=true;end();return}}}}
objects=objects.filter(o=>o.z<1.12&&(!o.got||o.z<1.02));$('score').textContent=Math.floor(distance);
road();objects.sort((a,b)=>a.z-b.z).forEach(drawObject);if(!(invuln>0&&Math.floor(time*14)%2===0))drawPlayer();requestAnimationFrame(loop)}
$('start').onclick=reset;
$('left').onclick=()=>move(-1);$('rightBtn').onclick=()=>move(1);$('jump').onclick=jump;$('slide').onclick=slide;
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))move(-1);if(['ArrowRight','d','D'].includes(e.key))move(1);if(['ArrowUp','w','W',' '].includes(e.key)){e.preventDefault();jump()}if(['ArrowDown','s','S'].includes(e.key))slide()});
let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();else slide()},{passive:true});
road();
})();
</script>
</body></html>
